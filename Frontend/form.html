<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <header>
        <span class="logo">Event Form</span>
        <nav>
            <a href="/">Formulaire</a>
            <a href="/liste.html">Liste</a>
        </nav>
    </header>

    <a class="retour" href="/liste.html">&larr; Retour à la liste</a>

    <h1 id="titre">Formulaire</h1>

    <form id="edit-form" hidden>

        <div class="champ">
            <label for="firstname">Prénom</label>
            <input type="text" id="firstname" name="name" required>
        </div>

        <div class="champ">
            <label for="lastname">Nom</label>
            <input type="text" id="lastname" name="surname" required>
        </div>

        <div class="champ">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="champ">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <p class="date" id="date"></p>

        <div class="actions">
            <button type="submit">Enregistrer</button>
            <button type="button" id="supprimer" class="danger">Supprimer</button>
        </div>
    </form>

    <p id="status" role="status"></p>

    <footer>
        <p>Created by Arthur &amp; Ruben. &copy; CPNV</p>
    </footer>

    <script src="/form.js"></script>
</body>
</html>
